[package]
name = "rebox-apple"
version = "1.0.1"
edition = "2024"

[dependencies]
isideload = { version = "=0.5.2", default-features = false, features = ["fs-storage", "tokio-mt", "install"] }
plist = "1"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
idevice = { version = "=0.1.68", default-features = false, features = ["ring", "tcp", "misagent"] }
